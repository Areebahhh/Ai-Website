<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Hero – Smarter Facilities Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #6366f1;
      --dark: #0f172a;
      --muted: #64748b;
      --light: #f8fafc;
      --card: #ffffff;
      --gradient: linear-gradient(135deg, #4f46e5, #6366f1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
    }

    header {
      background: var(--gradient);
      color: white;
      padding: 5rem 2rem 6rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 3rem;
      align-items: center;
    }

    .hero h1 {
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }

    .hero p {
      font-size: 1.1rem;
      color: #e0e7ff;
      margin-bottom: 2rem;
    }

    .cta {
      display: inline-block;
      background: white;
      color: var(--primary);
      padding: 0.9rem 1.6rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .hero-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .hero-card ul {
      list-style: none;
    }

    .hero-card li {
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .hero-card li::before {
      content: '✓';
      color: #a5b4fc;
      font-weight: bold;
    }

    section {
      padding: 5rem 2rem;
    }

    .section-title {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-title h2 {
      font-size: 2.4rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .section-title p {
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
    }

    .feature-card {
      background: var(--card);
      padding: 2.2rem;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      transition: transform 0.25s ease;
    }

    .feature-card:hover {
      transform: translateY(-6px);
    }

    .feature-card h3 {
      margin-bottom: 0.6rem;
      font-size: 1.3rem;
    }

    .feature-card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .workflow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2rem;
    }

    .step {
      text-align: center;
      padding: 2rem;
    }

    .step-number {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-weight: 700;
    }

    .cta-section {
      background: var(--dark);
      color: white;
      text-align: center;
      border-radius: 28px;
      margin: 0 2rem 4rem;
      padding: 4rem 2rem;
    }

    .cta-section h2 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    .cta-section p {
      color: #c7d2fe;
      margin-bottom: 2rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="container hero">
    <div>
      <h1>Office Hero<br>AI-Powered Facilities Management</h1>
      <p>
        Eliminate everyday offi
